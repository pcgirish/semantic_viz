  <style>

    .segmented-control button.active { background: var(--cool-cyan); color: var(--text-inverse); }

      user-select: none;

    .rail-legend summary::-webkit-details-marker { display: none; }

    .rail-legend summary:hover { color: var(--text-body); }
    .rail-legend-body { padding: 0 var(--gutter-tray) var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); }

    .center-area { flex: 1; display: flex; flex-direction: column; }
    .canvas {
      flex: 1; position: relative; overflow: auto; background: var(--surface-1);
    }
    .nodes-container { position: relative; }
    .flow-container { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
    .flow-step { padding: var(--space-4); background: var(--surface-2); border-radius: var(--radius-md);
      border: var(--border-w) solid var(--border-1); display: flex; align-items: center; gap: var(--space-4);
      position: relative; min-height: 60px;
    }
    .flow-step-num { font: var(--weight-bold) var(--text-md) var(--font-core); color: var(--cool-cyan); min-width: 32px; }
    .flow-step-info { flex: 1; }
    .flow-step-name { font: var(--weight-semibold) var(--text-sm) var(--font-core); color: var(--text-hi); }
    .flow-step-detail { font: var(--text-xs) var(--font-mono); color: var(--text-dim); margin-top: var(--space-1); }
    .flow-connector { position: absolute; left: 50%; width: 2px; height: 32px; background: var(--connector-flow); transform: translateX(-1px); }
    .bubble-container { display: flex; flex-wrap: wrap; gap: var(--space-8); padding: var(--space-6); align-items: flex-start; }
    .bubble { width: 100px; height: 100px; border-radius: 50%; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font: var(--weight-semibold) var(--text-sm) var(--font-mono);

    .bubble .count { font: var(--text-xs) var(--font-mono); color: var(--text-dim); margin-top: var(--space-2); }
    .node {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 88px; height: 88px; cursor: pointer; position: absolute;
      font: var(--weight-semibold) var(--text-sm)/1.15 var(--font-mono); color: var(--text-hi);
      word-break: break-word; text-align: center; padding: var(--space-2);
      transition: transform 200ms ease, opacity 150ms ease;
    }
    .node > span { position: relative; z-index: 1; pointer-events: none; }
    .node:hover { transform: translateY(-2px); }
    .node.dim { opacity: 0.28; }
    #connectors path { transition: opacity 150ms ease; }
    #connectors path.dim { opacity: 0.15; }
    .layer-box {
      position: absolute; border: var(--border-w) dashed var(--border-1); border-radius: var(--radius-md,8px);
      background: rgba(152,174,191,0.035); pointer-events: none;
    }
    .layer-box-label {
      position: absolute; top: -9px; left: 12px; display: inline-flex; align-items: center; gap: 5px;
      padding: 1px 8px 1px 6px; background: var(--surface-3); color: var(--text-faint);
      font: var(--weight-semibold) 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.09em;
      clip-path: var(--clip-chamfer-sm, polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px));
      border: var(--border-w) solid var(--border-1); white-space: nowrap;
    }
    .tray {
      width: var(--tray-w); background: var(--surface-tray); border-left: var(--border-w) solid var(--border-1);
      padding: var(--gutter-tray); overflow-y: auto; display: flex; flex-direction: column; gap: var(--gap-stack);
      box-shadow: var(--shadow-tray);
    }
    .stat-block { padding: var(--space-3); background: var(--surface-2); border-radius: var(--radius-md);
      border: var(--border-w) solid var(--border-1);
    }
    .stat-block h4 { margin: 0 0 var(--space-2) 0; font: var(--weight-semibold) var(--text-xs)/1 var(--font-core);
      color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.09em;
    }
    .stat-block p { margin: 0; font: var(--weight-medium) var(--text-sm) var(--font-mono);
      color: var(--text-body);
    }
    .risk-bar { display: flex; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: var(--space-2); }
    .risk-fill { height: 100%; background: var(--temp-6); }
    .mode-hidden { display: none; }
    svg { display: block; }
    .graph-container { position: relative; padding: var(--space-8); min-width: 100%; min-height: 100%; }
    .graph-node { position: absolute; background: var(--surface-2); border: var(--border-w) solid var(--border-1);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); cursor: pointer;
      font: var(--weight-semibold) var(--text-sm) var(--font-core); color: var(--text-hi);
      display: flex; align-items: center; gap: var(--space-2); transition: border-color 150ms ease; white-space: nowrap;
    }
    .graph-node:hover { border-color: var(--cool-cyan); }

    .graph-node.contract { border-color: var(--temp-4); }
    .graph-node.flagged { border-color: var(--temp-6); }
    .graph-node .note { display: block; font: var(--weight-regular) 10px var(--font-mono); color: var(--temp-5); margin-top: 2px; white-space: normal; max-width: 160px; }
    .graph-group-label { position: absolute; font: var(--weight-semibold) var(--text-xs) var(--font-core); color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.09em; top: 4px; left: 8px;
    }
    .graph-group-box { position: absolute; border: 1px dashed var(--border-1); border-radius: var(--radius-md); }
    .flow-node { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
      font: var(--weight-semibold) var(--text-sm) var(--font-core); color: var(--text-hi); cursor: pointer;
      padding: var(--space-2) var(--space-3); border: var(--border-w) solid var(--border-1); background: var(--surface-2);
      transition: border-color 150ms ease;
    }
    .flow-node:hover, .flow-node.selected { border-color: var(--cool-cyan); }
    .flow-node.terminal { border-radius: 999px; background: var(--surface-1); }
    .flow-node.decision { background: none; border: none; }
    .flowchart-crumb { align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6);
      background: var(--surface-0); border-bottom: var(--border-w) solid var(--border-hair); font: var(--text-xs) var(--font-mono);
    }
    .flowchart-crumb:not(.mode-hidden) { display: flex; }
    .flowchart-crumb button { padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); border: var(--border-w) solid var(--border-1);
      background: var(--surface-2); color: var(--text-dim); cursor: pointer; font: inherit;
    }
    .flowchart-crumb button:hover { background: var(--surface-3); color: var(--text-body); }
    .flowchart-crumb .path a { color: var(--cool-cyan); cursor: pointer; text-decoration: underline; }
    .flowchart-crumb .path span { color: var(--text-faint); margin: 0 var(--space-1); }

    .playback-controls { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-6) 0; }
    .playback-controls button { background: var(--surface-2); border: var(--border-w) solid var(--border-1); border-radius: var(--radius-sm);
      color: var(--text-body); cursor: pointer; font-size: 13px; width: 26px; height: 22px; display: flex; align-items: center; justify-content: center;
    }
    .playback-controls button:hover { background: var(--surface-3); }
    .playback-density { margin-left: auto; display: flex; gap: 0; border: var(--border-w) solid var(--border-1); border-radius: var(--radius-sm); overflow: hidden; }
    .playback-density button { border-radius: 0; border: none; border-right: var(--border-w) solid var(--border-1); width: auto; padding: 0 var(--space-3); height: 22px;
      font: var(--weight-medium) 10px var(--font-core); text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-dim);

    .playback-density button:last-child { border-right: none; }

    .playback-msg { color: var(--text-body); font: var(--weight-medium) var(--text-xs) var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
    .playback-scrubber { position: relative; height: 58px; padding: 0 var(--space-6); display: flex; align-items: flex-end; gap: 3px; }
    .playback-baseline { position: absolute; left: var(--space-6); right: var(--space-6); bottom: 27px; height: 1px; background: var(--border-hair); }
    .commit-tick { position: relative; flex: 1; min-width: 5px; max-width: 26px; height: 100%; padding: 0; background: transparent; border: none;
      cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px;
    }
    .commit-tick-cursor { position: absolute; bottom: -2px; left: -2px; right: -2px;
      border: 1.5px solid var(--cool-cyan); border-radius: var(--radius-xs);
      background: rgba(31,182,193,0.08); box-shadow: 0 0 8px rgba(31,182,193,0.35); pointer-events: none;
    }
    .commit-tick-bar { width: 100%; transition: opacity 150ms ease; }
    .commit-tick-dot { clip-path: var(--clip-diamond); transition: all 150ms ease; }
    .commit-tick:hover .commit-tick-bar { opacity: 1 !important; }
  </style>
</head>

    /** Rounded-vertex polygon path — quadratic joins trimmed back along each edge, so the
     *  outline never breaks at a chamfer corner (unlike CSS border + clip-path). */
    function facetPath(pts, r = 4) {
      const n = pts.length, out = [];
      const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
      const dist = (a,b) => Math.hypot(b[0]-a[0], b[1]-a[1]);
      for (let i = 0; i < n; i++) {
        const prev = pts[(i-1+n)%n], cur = pts[i], next = pts[(i+1)%n];
        const rIn = Math.min(r, dist(prev,cur)/2), rOut = Math.min(r, dist(cur,next)/2);
        const a = lerp(cur, prev, rIn/dist(prev,cur) || 0), b = lerp(cur, next, rOut/dist(cur,next) || 0);
        out.push(`${i===0?'M':'L'} ${a[0].toFixed(2)} ${a[1].toFixed(2)}`);
        out.push(`Q ${cur[0].toFixed(2)} ${cur[1].toFixed(2)} ${b[0].toFixed(2)} ${b[1].toFixed(2)}`);
      }
      return out.join(' ') + ' Z';
    }
    /** Renders a Facet-style faceted shape as inline SVG inside a container div, with a
     *  gradient fill and continuous stroke — the corner-gap-free replacement for
     *  `clip-path` on a bordered div. */
    function facetSVG(shape, w, h, { stroke = 'var(--border-1)', strokeWidth = 1, fill = 'none', fillTo, glow, cut = 7 } = {}) {
      const gid = 'f' + Math.random().toString(36).slice(2, 9);
      const pad = strokeWidth / 2;
      const pts = facetPoints(shape, w - strokeWidth, h - strokeWidth, cut).map(([x,y]) => [x+pad, y+pad]);
      const d = facetPath(pts, 4);
      const gradient = fillTo ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="${fill}"/><stop offset="1" stop-color="${fillTo}"/></linearGradient></defs>` : '';
      const fillAttr = fillTo ? `url(#${gid})` : fill;
      const filter = glow ? `filter:drop-shadow(0 0 6px ${glow});` : '';
      return `<svg width="${w}" height="${h}" style="position:absolute;inset:0;overflow:visible;${filter}">${gradient}<path d="${d}" fill="${fillAttr}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/></svg>`;
    }

    function hashTemp(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
      return h % 5;
    }

    function rankChildren(children, edges) {
      const ids = new Set(children.map(c => c.id));
      const local = edges.filter(e => ids.has(e.from) && ids.has(e.to));
      const rank = {};
      children.forEach(c => rank[c.id] = 0);
      let changed = true, guard = 0;
      while (changed && guard++ < children.length + 1) {
        changed = false;
        local.forEach(e => {
          if (rank[e.to] <= rank[e.from]) {
            rank[e.to] = rank[e.from] + 1;
            changed = true;
          }
        });
      }
      return { rank, local };
    }

    function badgeHTML(text, tone) {

    function riskMeterHTML(risk) {
      const value = Math.round((risk ?? 0) * 7);

      const segs = Array.from({length:7}).map((_,i) =>
        `<span style="flex:1;height:6px;background:${i<value?color:'var(--surface-3)'};clip-path:var(--clip-chamfer-sm);"></span>`

      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font:var(--weight-semibold) var(--text-xs) var(--font-mono);color:${color};">${value}/7</span>
        </div><div style="display:flex;gap:3px;">${segs}</div>`;
    }

      html += `<div class="stat-block">

        html += `<div class="stat-block"><h4>Risk</h4>${riskMeterHTML(u.risk)}</div>`;

          ['Where', u.semantics.where], ['Why', u.semantics.why]].filter(([,v]) => v);
        if (rows.length) {
          html += `<div class="stat-block">` + rows.map(([label, val]) =>
            `<h4 style="margin-top:var(--space-2);">${label}</h4><p style="font:var(--weight-regular) var(--text-sm) var(--font-core);color:var(--text-body);">${val}</p>`
          ).join('') + `</div>`;

    function ascend() {
      if (drill.length === 0) return;
      drill.pop();
      selected = null;
      render();
    }

    function renderDrillCrumb(current) {
      const el = document.getElementById('drill-crumb');
      const path = [getUnitById('u:sys:orderly'), ...drill.map(getUnitById)];
      el.classList.remove('mode-hidden');
      el.innerHTML = `
        ${drill.length > 0 ? `<button onclick="ascend()" title="Zoom out one level">← Zoom out</button>` : ''}
        <span class="path">${path.map((u, i) =>
          i === path.length - 1
            ? `<b style="color:var(--text-hi);">${u.name}</b>`
            : `<a onclick="drill=${JSON.stringify(drill.slice(0, i))};selected=null;render();">${u.name}</a><span>›</span>`
        ).join('')}</span>
      `;
    }

    function renderCurrentMode() {
      document.getElementById('nodes').style.display = 'block';
      document.getElementById('connectors').style.display = 'block';
      document.getElementById('flow-container').classList.add('mode-hidden');
      document.getElementById('bubble-container').classList.add('mode-hidden');

      const current = drill.length > 0 ? getUnitById(drill[drill.length-1]) : getUnitById('u:sys:orderly');
      renderDrillCrumb(current);
      const children = getChildren(current.id);
      const nodes = document.getElementById('nodes');
      nodes.innerHTML = '';
      const atRoot = current.id === 'u:sys:orderly';

      const nodeSize = 88, colGap = 170, rowGap = atRoot ? 160 : 120;
      const { rank, local } = rankChildren(children, FIXTURE.edges);
      const byRank = {};
      children.forEach(c => (byRank[rank[c.id]] = byRank[rank[c.id]] || []).push(c));

      const positions = {};
      Object.keys(byRank).sort((a, b) => a - b).forEach(r => {
        byRank[r].forEach((child, i) => {
          positions[child.id] = {x: 60 + Number(r) * colGap + nodeSize / 2, y: 50 + i * rowGap + nodeSize / 2};
        });
      });

      const maxRank = Math.max(0, ...Object.keys(byRank).map(Number));
      const maxRows = Math.max(...Object.values(byRank).map(a => a.length), 1);
      nodes.style.width = (60 + (maxRank + 1) * colGap + nodeSize) + 'px';
      nodes.style.height = (50 + maxRows * rowGap + nodeSize) + 'px';

      // Architectural blocks: at system root, each child IS a layer — draw a dashed
      // GroupFrame box around it (and its rank-siblings) to read as a module boundary,
      // not just a floating tile.
      if (atRoot) {
        children.forEach((child) => {
          const { x, y } = positions[child.id];
          const pad = 26;
          const box = document.createElement('div');
          box.className = 'layer-box';
          box.style.left = (x - nodeSize/2 - pad) + 'px';
          box.style.top = (y - nodeSize/2 - pad) + 'px';
          box.style.width = (nodeSize + pad*2) + 'px';
          box.style.height = (nodeSize + pad*2) + 'px';
          const childCount = getChildren(child.id).length;
          box.innerHTML = `<span class="layer-box-label">${child.name}${childCount ? ' · ' + childCount : ''}</span>`;
          nodes.appendChild(box);
        });
      }

      children.forEach((child) => {
        const { x, y } = positions[child.id];
        const color = tempHex(mode === 'delta' ? Math.round((child.risk ?? 0) * 7) : hashTemp(child.id));
        const shape = child.children && child.children.length > 0 ? 'hex' : 'chamfer';
        const isSelected = selected === child.id;
        const div = document.createElement('div');
        div.className = 'node';
        div.dataset.id = child.id;
        div.style.left = (x - nodeSize/2) + 'px';
        div.style.top = (y - nodeSize/2) + 'px';
        div.style.width = nodeSize + 'px';
        div.style.height = nodeSize + 'px';
        const solid = isSelected;
        div.innerHTML = facetSVG(shape, nodeSize, nodeSize, {
          stroke: isSelected ? color : color + 'aa',
          strokeWidth: isSelected ? 1.5 : 1,
          fill: solid ? color : color + '3d',
          fillTo: solid ? color + '66' : color + '12',
          glow: isSelected ? color + 'aa' : undefined
        }) + `<span style="color:${isSelected ? 'var(--text-hi)' : 'var(--text-hi)'}">${child.name}</span>`;
        div.title = (child.qualname || child.name) + (child.children?.length ? ' — double-click to open' : '');
        div.onclick = (e) => {
          selected = selected === child.id ? null : child.id;
          render();
          e.stopPropagation();
        };
        div.ondblclick = (e) => {
          if (child.id === FIXTURE.flowchart.root) {
            enterFlowchart();
          } else if (child.children && child.children.length > 0) {
            drill.push(child.id);
            selected = null;
            render();
          }
          e.stopPropagation();
        };
        nodes.appendChild(div);
      });

      const svg = document.getElementById('connectors');
      svg.setAttribute('width', nodes.style.width);
      svg.setAttribute('height', nodes.style.height);
      svg.innerHTML = '';

      local.forEach((e) => {
        const pFrom = positions[e.from], pTo = positions[e.to];
        if (!pFrom || !pTo) return;
        const sameCol = rank[e.from] === rank[e.to];
        const x1 = pFrom.x + nodeSize / 2, y1 = pFrom.y, x2 = pTo.x - nodeSize / 2, y2 = pTo.y;
        const d = sameCol ? orthoPath(pFrom.x, pFrom.y + nodeSize / 2, pTo.x, pTo.y - nodeSize / 2, 10, 14)
          : `M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`;
        const stroke = e.kind === 'calls' ? 'var(--connector-active)' : 'var(--cool-indigo)';
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', stroke);
        path.setAttribute('stroke-width', e.heavy ? 'var(--connector-w-heavy)' : 'var(--connector-w)');
        path.setAttribute('stroke-linecap', 'round');
        path.dataset.from = e.from;
        path.dataset.to = e.to;
        path.dataset.baseStroke = stroke;
        path.dataset.markerBase = arrowMarkerFor(svg, stroke);
        path.setAttribute('marker-end', `url(#${path.dataset.markerBase})`);
        svg.appendChild(path);
      });

      bindHoverTrace(nodes, svg);
    }

    /** Hover a node: dim everything not directly connected, and recolor edges by
     *  direction relative to the hovered node — incoming (A→hovered) vs outgoing
     *  (hovered→B) — temporarily overriding the calls/imports kind color. */
    function bindHoverTrace(nodesEl, svg) {
      const nodeDivs = [...nodesEl.querySelectorAll('.node[data-id]')];
      const paths = [...svg.querySelectorAll('path[data-from]')];
      nodeDivs.forEach((div) => {
        const id = div.dataset.id;
        div.onmouseenter = () => {
          const incoming = new Set(), outgoing = new Set();
          paths.forEach((p) => {
            if (p.dataset.to === id) incoming.add(p.dataset.from);
            if (p.dataset.from === id) outgoing.add(p.dataset.to);
          });
          nodeDivs.forEach((o) => {
            const i = o.dataset.id;
            o.classList.toggle('dim', i !== id && !incoming.has(i) && !outgoing.has(i));
          });
          paths.forEach((p) => {
            if (p.dataset.to === id) {
              p.setAttribute('stroke', 'var(--cool-azure)');
              p.setAttribute('marker-end', `url(#${arrowMarkerFor(svg, 'var(--cool-azure)')})`);
            } else if (p.dataset.from === id) {
              p.setAttribute('stroke', 'var(--temp-4)');
              p.setAttribute('marker-end', `url(#${arrowMarkerFor(svg, 'var(--temp-4)')})`);
            } else {
              p.classList.add('dim');
            }
          });
        };
        div.onmouseleave = () => {
          nodeDivs.forEach((o) => o.classList.remove('dim'));
          paths.forEach((p) => {
            p.classList.remove('dim');
            p.setAttribute('stroke', p.dataset.baseStroke);
            p.setAttribute('marker-end', `url(#${p.dataset.markerBase})`);
          });
        };
      });
    }

    /** Returns (creating if needed) a <marker> arrowhead filled with the given color,
     *  memoized per-svg so repeated calls with the same color reuse one marker. */
    function arrowMarkerFor(svg, color) {
      let defs = svg.querySelector('defs');
      if (!defs) {
        defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        svg.insertBefore(defs, svg.firstChild);
      }
      const id = 'cd-arrow-' + color.replace(/[^a-z0-9]/gi, '');
      if (!defs.querySelector('#' + id)) {
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 8 8');
        marker.setAttribute('refX', '7');
        marker.setAttribute('refY', '4');
        marker.setAttribute('markerWidth', '7');
        marker.setAttribute('markerHeight', '7');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M0 0 L8 4 L0 8 z');
        path.setAttribute('fill', color);
        marker.appendChild(path);
        defs.appendChild(marker);
      }
      return id;
    }

    /** Draws a ConnectorLayer-style path (bezier by default, ortho for same-column pairs)
     *  between two {x,y} anchor points into an existing <svg id="connectors">. */
    function drawConnector(svg, x1, y1, x2, y2, opts = {}) {
      const { ortho = false, clearY = null, label = null, stroke = 'var(--connector)', heavy = false } = opts;
      const d = clearY != null
        ? orthoPathBottomToTop(x1, y1, x2, y2, clearY, 10)
        : ortho
        ? orthoPath(x1, y1, x2, y2, 10, 14)
        : `M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', stroke);
      path.setAttribute('stroke-width', heavy ? 'var(--connector-w-heavy)' : 'var(--connector-w)');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('marker-end', `url(#${arrowMarkerFor(svg, stroke)})`);
      svg.appendChild(path);
      if (label) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', (x1 + x2) / 2);
        text.setAttribute('y', (y1 + y2) / 2 - 6);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', 'var(--text-faint)');
        text.setAttribute('style', `font: var(--text-xs) var(--font-mono);`);
        text.textContent = label;
        svg.appendChild(text);
      }
    }

    function authorBadge(author) {
      if (!author) return '';
      return `<span class="badge-author ${author}" title="${author}">${author === 'agent' ? 'A' : 'H'}</span>`;
    }

    let selectedRoute = FIXTURE.apiFlow.routes[0].id;

    /** API Flow — left rail lists every entry-point route; selecting one draws that route's
     *  flow only: consumers fan into the route, then a left-to-right chain of the modules/
     *  functions that serve it, each edge labeled with what it does (guards/authenticates/
     *  handles). Graphical (boxes + routed arrows), not a linear numbered list. */
    function renderFlowsMode() {
      document.getElementById('nodes').style.display = 'none';
      document.getElementById('connectors').style.display = 'block';
      document.getElementById('flow-container').classList.add('mode-hidden');
      document.getElementById('bubble-container').classList.add('mode-hidden');
      const graph = document.getElementById('graph-container');
      graph.style.display = 'block';
      graph.classList.remove('mode-hidden');
      graph.innerHTML = '';

      const route = FIXTURE.apiFlow.routes.find(r => r.id === selectedRoute) || FIXTURE.apiFlow.routes[0];
      const colGap = 200, rowGap = 100;
      const w = 140 + (route.steps.length) * colGap, h = Math.max(340, 90 + route.consumers.length * rowGap);
      graph.style.width = w + 'px';
      graph.style.height = h + 'px';

      const positions = {};
      route.consumers.forEach((c, i) => positions[c.id] = { x: 30, y: 50 + i * rowGap });
      const routeId = 'route:' + route.id;
      positions[routeId] = { x: 260, y: h / 2 - 24 };
      route.steps.forEach((s, i) => positions[s.id] = { x: 260 + (i + 1) * colGap, y: h / 2 - 24 });

      function addNode(id, label, cls, opts = {}) {
        const div = document.createElement('div');
        div.className = `graph-node ${cls}`;
        if (selected === id) div.classList.add('selected');
        div.style.left = positions[id].x + 'px';
        div.style.top = positions[id].y + 'px';
        div.innerHTML = `${authorBadge(opts.author)}<span>${label}${opts.note ? `<span class="note">${opts.note}</span>` : ''}</span>`;
        div.onclick = (e) => {
          if (opts.flowchart) { enterFlowchart(); }
          else select(id);
          e.stopPropagation();
        };
        graph.appendChild(div);
      }

      route.consumers.forEach(c => addNode(c.id, c.name, 'consumer'));
      addNode(routeId, `${route.method} ${route.path}`, 'contract', { note: route.note });
      route.steps.forEach(s => addNode(s.id, s.name, s.flagged ? 'flagged' : 'contract', { author: s.author, flowchart: s.flowchart }));

      const svg = document.getElementById('connectors');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.innerHTML = '';

      requestAnimationFrame(() => {
        const anchor = (id, side) => {
          const el = [...graph.children].find(c => c.style.left === positions[id].x + 'px' && c.style.top === positions[id].y + 'px');
          const p = positions[id];
          const width = el ? el.offsetWidth : 140, height = el ? el.offsetHeight : 40;
          return side === 'right' ? { x: p.x + width, y: p.y + height / 2 } : { x: p.x, y: p.y + height / 2 };
        };
        route.consumers.forEach(c => {
          const a = anchor(c.id, 'right'), b = anchor(routeId, 'left');
          drawConnector(svg, a.x, a.y, b.x, b.y, { stroke: 'var(--connector)' });
        });
        let prev = routeId;
        route.steps.forEach(s => {
          const a = anchor(prev, 'right'), b = anchor(s.id, 'left');
          drawConnector(svg, a.x, a.y, b.x, b.y, { label: s.edgeLabel, stroke: s.flagged ? 'var(--temp-5)' : 'var(--connector-active)' });
          prev = s.id;
        });
      });
    }

    /** Flowchart — real control-flow notation for one function: pill terminals, rectangle
     *  process steps, diamond decisions with yes/no branches. Reached by drilling into
     *  create_order from Current mode, mirrors the earlier build's flowchart screen. */
    function renderFlowchartMode() {
      document.getElementById('nodes').style.display = 'none';
      document.getElementById('connectors').style.display = 'block';
      document.getElementById('flow-container').classList.add('mode-hidden');
      document.getElementById('bubble-container').classList.add('mode-hidden');
      const graph = document.getElementById('graph-container');
      graph.style.display = 'block';
      graph.classList.remove('mode-hidden');
      graph.innerHTML = '';

      document.getElementById('flowchart-crumb').classList.remove('mode-hidden');
      document.getElementById('flowchart-crumb').innerHTML = `
        <span class="path"><a onclick="exitFlowchart()">orderly</a><span>›</span>Call Graph<span>›</span>${FIXTURE.flowchart.title}</span>
      `;

      const { nodes, edges } = FIXTURE.flowchart;
      const col = { start:0, validate:1, valid:2, price:3, persist:4, return400:2, charge:4, chargeok:3, rollback:2, emit:3 };
      const row = { start:0, validate:0, valid:0, price:0, persist:0, return400:1, charge:1, chargeok:1, rollback:2, emit:2 };
      const colGap = 190, rowGap = 130, nodeW = 150, nodeH = 56;
      const w = 60 + 5 * colGap + nodeW, h = 60 + 3 * rowGap + nodeH;
      graph.style.width = w + 'px';
      graph.style.height = h + 'px';

      const positions = {};
      nodes.forEach(n => {
        positions[n.id] = { x: 60 + col[n.id] * colGap, y: 60 + row[n.id] * rowGap };
      });

      nodes.forEach(n => {
        const div = document.createElement('div');
        const shape = n.kind === 'decision' ? 'decision' : n.kind === 'terminal' ? 'terminal' : '';
        div.className = `flow-node ${shape}`;
        if (selected === n.id) div.classList.add('selected');
        div.style.left = positions[n.id].x + 'px';
        div.style.top = positions[n.id].y + 'px';
        const isSelected = selected === n.id;
        const stroke = isSelected ? 'var(--cool-cyan)' : 'var(--border-1)';
        if (n.kind === 'decision') {
          div.style.width = nodeW + 'px'; div.style.height = nodeH + 'px';
          div.style.background = 'none'; div.style.border = 'none';
          div.innerHTML = facetSVG('diamond', nodeW, nodeH, { stroke, strokeWidth: isSelected ? 1.5 : 1, fill: 'var(--surface-3)' });
        } else {
          div.style.minWidth = nodeW + 'px'; div.style.minHeight = nodeH + 'px';
        }
        div.innerHTML += `<span style="position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;">${authorBadge(n.author)}<span>${n.label}</span></span>`;
        div.onclick = (e) => { select(n.id); e.stopPropagation(); };
        graph.appendChild(div);
      });

      const svg = document.getElementById('connectors');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.innerHTML = '';

      requestAnimationFrame(() => {
        edges.forEach(e => {
          const pf = positions[e.from], pt = positions[e.to];
          const sameRow = row[e.from] === row[e.to];
          const sameCol = col[e.from] === col[e.to];
          const goesLeft = sameRow && pt.x < pf.x;
          let x1, y1, x2, y2, ortho, clearY;
          if (sameRow) {
            x1 = pf.x + (goesLeft ? 0 : nodeW); y1 = pf.y + nodeH / 2;
            x2 = pt.x + (goesLeft ? nodeW : 0); y2 = pt.y + nodeH / 2;
            ortho = false; clearY = null;
          } else if (sameCol) {
            x1 = pf.x + nodeW / 2; y1 = pf.y + nodeH;
            x2 = pt.x + nodeW / 2; y2 = pt.y;
            ortho = true; clearY = null;
          } else {
            // Diagonal: differs in both row and column — exit the source from its bottom
            // and enter the target at its top-center, routed below the source's row so
            // the path never crosses another node sharing that row.
            x1 = pf.x + nodeW / 2; y1 = pf.y + nodeH;
            x2 = pt.x + nodeW / 2; y2 = pt.y;
            ortho = false; clearY = pf.y + nodeH + (rowGap - nodeH) / 2;
          }
          drawConnector(svg, x1, y1, x2, y2, { ortho, clearY, label: e.label, stroke: e.label === 'no' ? 'var(--temp-5)' : 'var(--connector-active)' });
        });
      });
    }

    function setMode(m) {
      mode = m;
      drill = [];
      selected = null;
      document.querySelectorAll('#mode-control button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      render();
    }

    /** Flowchart has no top-level tab — it's reached only by drilling into a function tile
     *  from Current/Delta mode or an API Flow step, and returning restores the mode and
     *  drill depth you came from. */
    function enterFlowchart() {
      preFlowchartMode = mode;
      preFlowchartDrill = drill.slice();
      mode = 'flowchart';
      selected = null;
      render();
    }

    function exitFlowchart() {
      mode = preFlowchartMode;
      drill = preFlowchartDrill || [];
      selected = null;
      document.querySelectorAll('#mode-control button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      render();
    }

    function renderDependsMode() {
      document.getElementById('nodes').style.display = 'none';
      document.getElementById('connectors').style.display = 'none';
      document.getElementById('flow-container').classList.add('mode-hidden');
      document.getElementById('bubble-container').classList.remove('mode-hidden');

      const bubbles = document.getElementById('bubble-container');
      bubbles.innerHTML = FIXTURE.externals.map(ext => {
        const color = tempHex(hashTemp(ext.id));
        return `
          <div class="bubble" onclick="select('${ext.id}')" style="background-color: ${color}3d; border-color: ${color};">
            <div>${ext.name}</div>
            <div class="count">${ext.call_sites} calls</div>
          </div>
        `;
      }).join('');
    }

    const MODE_LABEL = { current: 'Current', delta: 'Delta', flows: 'API Flow', flowchart: 'Flowchart', depends: 'Depends on' };

    /** Bottom playback tray — scrubs the commit/PR history. Bar height = churn, color =
     *  temperature, diamond marks the selected point. Density toggle groups by PR instead
     *  of by raw commit. */
    function renderPlayback() {
      const tray = document.getElementById('playback-tray');
      const { commits } = FIXTURE.history;

      let items = commits;
      if (historyDensity === 'pr') {
        const byPr = new Map();
        commits.forEach(c => {
          const cur = byPr.get(c.pr);
          if (!cur || c.temp > cur.temp) byPr.set(c.pr, { ...c, count: (cur?.count || 0) + 1, churn: (cur?.churn || 0) + c.churn });
          else cur.count = (cur.count || 1) + 1, cur.churn += c.churn;
        });
        items = [...byPr.values()];
      }
      const current = items[Math.min(historyIndex, items.length - 1)] || items[items.length - 1];

      tray.innerHTML = `
        <div class="playback-controls">
          <button title="Play">▶</button>
          <div class="playback-msg">${current.sha ? current.sha + ' · ' : ''}${current.message}${current.pr ? ` (PR #${current.pr})` : ''}</div>
          <div class="playback-density">
            <button data-density="commit" class="${historyDensity==='commit'?'active':''}">Commits</button>
            <button data-density="pr" class="${historyDensity==='pr'?'active':''}">PRs</button>
          </div>
        </div>
        <div class="playback-scrubber">
          <div class="playback-baseline"></div>
          ${items.map((c, i) => {
            const col = tempHex(c.temp ?? 1);
            const h = 6 + Math.min(24, (c.churn || 1) / 3);
            const on = i === Math.min(historyIndex, items.length - 1);
            const dotSize = on ? 7 : 5;
            const cursorH = h + 4 + dotSize + 4;
            return `<button class="commit-tick${on ? ' current' : ''}" data-idx="${i}" title="${c.sha || 'PR #'+c.pr} · ${c.message}">
              ${on ? `<span class="commit-tick-cursor" style="height:${cursorH}px;"></span>` : ''}
              <span class="commit-tick-bar" style="height:${h}px;background:${col};opacity:${on?1:0.55};"></span>
              <span class="commit-tick-dot" style="width:${dotSize}px;height:${dotSize}px;background:${on?'var(--text-hi)':col};box-shadow:${on?'0 0 0 3px rgba(31,182,193,0.35)':'none'};"></span>
            </button>`;
          }).join('')}
        </div>
      `;
      tray.querySelectorAll('.commit-tick').forEach(btn => {
        btn.onclick = () => { historyIndex = Number(btn.dataset.idx); renderPlayback(); };
      });
      tray.querySelectorAll('.playback-density button').forEach(btn => {
        btn.onclick = () => { historyDensity = btn.dataset.density; historyIndex = 999; renderPlayback(); };
      });
    }

    function render() {
      renderRail();
      renderLegend();
      renderTray();
      renderPlayback();
      document.getElementById('header-info').textContent = `6ab4e5e · ${MODE_LABEL[mode]} mode`;

      ['nodes', 'connectors', 'flow-container', 'bubble-container', 'graph-container'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
      document.getElementById('flowchart-crumb').classList.add('mode-hidden');
      document.getElementById('drill-crumb').classList.add('mode-hidden');

      if (mode === 'current' || mode === 'delta') renderCurrentMode();
      else if (mode === 'flows') renderFlowsMode();
      else if (mode === 'flowchart') renderFlowchartMode();
      else if (mode === 'depends') renderDependsMode();
    }

    function select(id) {
      selected = selected === id ? null : id;
      renderTray();
    }

    document.querySelectorAll('#mode-control button').forEach(btn => {
      btn.addEventListener('click', (e) => setMode(e.target.dataset.mode));
    });

    document.getElementById('canvas').addEventListener('dblclick', (e) => {
      if ((mode === 'current' || mode === 'delta') && e.target.id === 'canvas') ascend();
    });

    document.querySelectorAll('#skin-control button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#skin-control button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.documentElement.setAttribute('data-skin', e.target.dataset.skin);
      });
    });

    render();
  </script>
</body>
</html>
