# Adapted from `scv init`. Fails a PR whose committed .scv/semantics/ store is stale, missing or
# orphaned entries; fix it with the agent-analyze-pr skill and commit the store.
# Unlike the generated workflow, this repo is scv itself, so it builds scv from its own checkout
# instead of cloning it from a pinned ref.
name: scv-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build scv from this checkout
        run: npm ci && npm run build --workspace packages/cli
      - name: scv check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node packages/cli/dist/bin.js check --base "origin/$BASE_REF"
